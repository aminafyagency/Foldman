name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        id: sdk
        run: |
          # The runner image ships the Android SDK; just accept licences and add the platform.
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME" | tee sdk.log
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "sdkmanager=$SDKM" | tee -a sdk.log
          (yes | "$SDKM" --licenses) >> sdk.log 2>&1 || true
          "$SDKM" "platforms;android-37" >> sdk.log 2>&1 || echo "platform 37 install failed (AGP will try)" | tee -a sdk.log
          ls "$ANDROID_HOME/platforms" | tee -a sdk.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing config
        run: |
          # Uses a private key from the KEYSTORE_B64 secret when one is set, otherwise the
          # key committed in ci/ (fine for sideloading; use a secret before any store release).
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            STORE="$RUNNER_TEMP/release.jks"; PASS="${{ secrets.KEYSTORE_PASSWORD }}"; ALIAS="${{ secrets.KEY_ALIAS }}"
          else
            STORE="$GITHUB_WORKSPACE/ci/foldman-release.jks"; PASS="foldman-aminafy"; ALIAS="foldman"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE" "$PASS" "$ALIAS" "$PASS" > signing.properties

      - name: Build release APK
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          touch build.log sdk.log
          # Surface errors as annotations so they can be read from the commit's check run.
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          ERR=$(grep -E '^(e: |w: .*error|ERROR:|FAILURE:|> )|What went wrong|Could not|Execution failed' build.log | head -80 | enc)
          echo "::error title=Compile errors::${ERR:-none}"
          TAIL=$(grep -v '^\s*at ' build.log | tail -n 40 | enc)
          echo "::error title=Build log tail::${TAIL:-empty}"
          if [ "${{ steps.sdk.outcome }}" != "success" ]; then
            SDK=$(tail -n 40 sdk.log | enc)
            echo "::error title=SDK log::${SDK:-empty}"
          fi
          echo "::error title=Steps::sdk=${{ steps.sdk.outcome }} gradle=${{ steps.gradle.outcome }}"

      - name: Find APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
